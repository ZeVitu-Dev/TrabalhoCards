<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Lexend+Deca&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style.css">

  <title>Componente de Card de Prévia de Estatísticas</title>
</head>

<body>
  <main class="card">
    <div class="content">
      <h1>Get <span class="destaqueroxo">insights</span> that help your business grow.</h1>

      <p class="descricao">Discover the benefits of data analytics and make better decisions regarding revenue, customer
        experience, and overall efficiency.</p>

      <div class="stats">

        <div class="valores">
          <p class="linhanumero">10k+</p>
          <p class="linharotulo">companies</p>
        </div>
        <div class="valores">
          <p class="linhanumero">314</p>
          <p class="linharotulo">templates</p>
        </div>
        <div class="valores">
          <p class="linhanumero">12M+</p>
          <p class="linharotulo">queries</p>
        </div>
      </div>
    </div>
    <div class="image-container">
      <img class="card-img" src="images/image-header-desktop.jpg" alt="Pessoas trabalhando em um escritorio">
    </div>
  </main>
</body>

</html>
